<form [formGroup]="form()" (ngSubmit)="onSubmit()" class="dynamic-form-container" [ngClass]="[containerClass(), styleClass(), 'layout-' + layout()]">
  @for (field of fields(); track field.name) {
    <div [ngClass]="['dynamic-form-field', field.fieldClass ?? '']">
      <label [for]="field.name" class="field-label">
        {{ field.label }}
        @if (field.required) {
          <span class="text-red-500">*</span>
        }
      </label>

      @switch (field.type) {
        @case ('text') {
          <input
            pInputText
            [id]="field.name"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />
        }
        @case ('number') {
          <input
            pInputText
            type="number"
            [id]="field.name"
            [formControlName]="field.name"
            [placeholder]="field.placeholder ?? ''"
          />
        }
      }

      @if (form().get(field.name)?.invalid && form().get(field.name)?.touched) {
        <small class="field-error">
          {{ field.errorMessage ?? (field.label + ' is invalid.') }}
        </small>
      }
    </div>
  }

  <div class="form-actions">
    <p-button
      type="submit"
      [label]="submitLabel()"
      [disabled]="form().invalid || loading()"
      [loading]="loading()"
    />
  </div>
</form>
