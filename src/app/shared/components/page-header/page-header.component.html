<header class="page-header-container">
  <div class="page-header-titles">
    <h1 class="page-title">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="page-subtitle">{{ subtitle() }}</p>
    }
  </div>
  <div class="page-header-actions">
    <ng-content select="[actions]" />
  </div>
</header>
